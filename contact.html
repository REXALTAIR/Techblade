  <section class="section" id="contact">
        <h2>Visit Us or Send a Message</h2>
        <p class="section-subtitle">We'd love to hear from you. Drop by our shop or send us an inquiry.</p>
        
        <div style="display: flex; gap: 40px; flex-wrap: wrap; justify-content: center;">
            <!-- Contact Form -->
            <div style="flex: 1; min-width: 300px; background: white; padding: 30px; border-radius: 12px; box-shadow: var(--shadow);">
                <h3 style="margin-bottom: 20px;">Send us a message</h3>
                <form action="#" method="POST" style="display: flex; flex-direction: column; gap: 15px;">
                    <input type="text" placeholder="Your Name" required style="padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-family: inherit;">
                    <input type="email" placeholder="Your Email" required style="padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-family: inherit;">
                    <textarea placeholder="How can we help you?" rows="4" required style="padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-family: inherit;"></textarea>
                    <button type="submit" class="btn" style="border: none; width: 100%;">Send Message</button>
                </form>
            </div>
